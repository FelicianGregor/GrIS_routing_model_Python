[pytest]
testpaths = tests
addopts = -ra
markers =
    model: runs the full Python model (about 1-2 minutes, once per session)
    slow: several full model runs (seed-spread study); deselect with -m "not slow"
    matlab_fixed: needs the fixed-neighbour-order MATLAB reference (tests/matlab/make_matlab_references.m)
filterwarnings =
    ignore:The default value for `spmatrix`:DeprecationWarning
    ignore:Setting the shape on a NumPy array:DeprecationWarning
